<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyAI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #222;
}

header {
    background: #ffffff;
    padding: 18px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 6px 0 0;
    color: #666;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 20px;
}

.categories {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 20px;
}

.category {
    background: white;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 10px 15px;
    cursor: pointer;
}

.category:hover {
    background: #eef3ff;
}

.chat {
    min-height: 350px;
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

.message {
    margin-bottom: 18px;
    line-height: 1.6;
}

.user {
    text-align: right;
}

.user span {
    display: inline-block;
    background: #e7efff;
    padding: 10px 14px;
    border-radius: 15px;
}

.ai span {
    display: inline-block;
    background: #f0f0f0;
    padding: 10px 14px;
    border-radius: 15px;
}

.input-area {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

input {
    flex: 1;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 16px;
}

button {
    border: none;
    background: #2563eb;
    color: white;
    padding: 14px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #1d4ed8;
}

#status {
    text-align: center;
    color: #777;
    margin-top: 10px;
}
</style>
</head>

<body>

<header>
    <h1>📚 StudyAI</h1>
    <p>Your AI study assistant</p>
</header>

<div class="container">

    <div class="categories">
        <div class="category" onclick="setQuestion('Explain photosynthesis')">🌱 Biology</div>
        <div class="category" onclick="setQuestion('Explain Newtons laws of motion')">🌍 Physics</div>
        <div class="category" onclick="setQuestion('Solve 25 × 16')">🔢 Maths</div>
    </div>

    <div class="chat" id="chat">

        <div class="message ai">
            <span>
                👋 Hi! I'm StudyAI.<br>
                Ask me any study question.
            </span>
        </div>

    </div>

    <div class="input-area">
        <input
            id="question"
            type="text"
            placeholder="Ask anything..."
            onkeydown="if(event.key === 'Enter') askAI()"
        >

        <button onclick="askAI()">Ask ✨</button>
    </div>

    <div id="status"></div>

</div>

<script>

function setQuestion(text) {
    document.getElementById("question").value = text;
    document.getElementById("question").focus();
}

async function askAI() {

    const input = document.getElementById("question");
    const question = input.value.trim();

    if (!question) {
        return;
    }

    const chat = document.getElementById("chat");
    const status = document.getElementById("status");

    chat.innerHTML += `
        <div class="message user">
            <span>${question}</span>
        </div>
    `;

    input.value = "";
    status.innerText = "StudyAI is thinking... 🤖";

    try {

        const response = await fetch("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        const data = await response.json();

        chat.innerHTML += `
            <div class="message ai">
                <span>${data.answer || "Sorry, I couldn't answer that."}</span>
            </div>
        `;

        status.innerText = "";

    } catch (error) {

        chat.innerHTML += `
            <div class="message ai">
                <span>❌ Sorry, something went wrong.</span>
            </div>
        `;

        status.innerText = "";
    }

    chat.scrollTop = chat.scrollHeight;
}

</script>

</body>
</html>
