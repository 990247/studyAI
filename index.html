
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyAI</title>
<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6fb;
color:#172033;
}

.header{
padding:22px 20px;
background:linear-gradient(135deg,#5b5bf7,#7b4cff);
color:white;
border-radius:0 0 28px 28px;
}

.logo{
font-size:28px;
font-weight:bold;
}

.tagline{
margin-top:6px;
opacity:.9;
}

.container{
max-width:700px;
margin:auto;
padding:20px;
}

.card{
background:white;
border-radius:22px;
padding:20px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
margin-top:18px;
}

textarea{
width:100%;
height:120px;
border:1px solid #ddd;
border-radius:16px;
padding:15px;
font-size:16px;
resize:none;
outline:none;
}

textarea:focus{
border-color:#635bff;
}

button{
width:100%;
margin-top:14px;
padding:15px;
border:0;
border-radius:15px;
background:#635bff;
color:white;
font-size:17px;
font-weight:bold;
}

button:active{
transform:scale(.98);
}

.quick{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:15px;
}

.quick button{
width:auto;
margin:0;
padding:9px 13px;
font-size:14px;
background:#eef0ff;
color:#4b46b8;
}

.answer{
margin-top:20px;
line-height:1.7;
font-size:16px;
white-space:pre-wrap;
}

.answer h3{
margin-bottom:5px;
color:#4d46c7;
}

.footer{
text-align:center;
padding:25px;
font-size:13px;
color:#777;
}
</style>
</head>

<body>

<div class="header">
<div class="container">
<div class="logo">🧠 StudyAI</div>
<div class="tagline">Your smart study assistant</div>
</div>
</div>

<div class="container">

<div class="card">

<h2>Ask anything 📚</h2>

<textarea id="question"
placeholder="Ask a study question..."></textarea>

<div class="quick">
<button onclick="setQuestion('Explain photosynthesis simply')">
🌱 Biology
</button>

<button onclick="setQuestion('Explain gravity simply')">
🌍 Physics
</button>

<button onclick="setQuestion('Explain fractions with examples')">
🔢 Maths
</button>
</div>

<button onclick="askAI()" id="askButton">
✨ Ask StudyAI
</button>

<div id="answer" class="answer"></div>

</div>

<div class="footer">
StudyAI • Learn smarter, one question at a time
</div>

</div>

<script>

function setQuestion(text){
document.getElementById("question").value=text;
}

async function askAI(){

const question=document.getElementById("question").value.trim();
const answer=document.getElementById("answer");
const button=document.getElementById("askButton");

if(!question){
answer.innerText="Please enter a question first.";
return;
}

button.innerText="⏳ Thinking...";
button.disabled=true;
answer.innerText="StudyAI is thinking...";

try{

const response=await fetch("/ask",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
question:question
})
});

const data=await response.json();

let text=data.answer || "No answer received.";

text=text
.replace(/###/g,"")
.replace(/\*\*/g,"")
.replace(/\\text\{([^}]*)\}/g,"$1")
.replace(/\\underbrace\{([^}]*)\}_\{[^}]*\}/g,"$1")
.replace(/\\rightarrow/g,"→")
.replace(/\\times/g,"×")
.replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g,"$1/$2");

answer.innerText=text;

}catch(error){

answer.innerText="Sorry, StudyAI could not connect. Please try again.";

}

button.innerText="✨ Ask StudyAI";
button.disabled=false;

}

</script>

</body>
</html>
